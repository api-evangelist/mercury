meters:
  - name: subscription_fee
    description: >-
      Recurring monthly or annual subscription for the active product tier (Free,
      Plus, or Pro).
    unit: month
    aggregation: sum
    dimensions:
      - plan_tier
      - billing_cycle
  - name: ach_invoice_payment
    description: >-
      Per-payment fee on inbound ACH invoice payments for the Plus tier
      ($1 per payment); waived on Pro.
    unit: payment
    aggregation: sum
    dimensions:
      - plan_tier
  - name: outbound_wire
    description: >-
      Outbound wire fees for international wires and certain domestic non-included
      wire types.
    unit: wire
    aggregation: sum
    dimensions:
      - wire_type
      - destination_country
  - name: card_interchange_credit
    description: >-
      Cashback/rewards credit applied against corporate card spend (offsets cost on
      qualifying transactions).
    unit: transaction
    aggregation: sum
    dimensions:
      - card_id
      - merchant_category
  - name: treasury_yield
    description: >-
      Yield credit accrued on Mercury Treasury balances; appears as an account
      credit and reduces effective cost.
    unit: USD
    aggregation: sum
    dimensions:
      - account_id
      - portfolio
principles:
  - name: Visibility
    description: >-
      Pull statements via the Statements API and use the Transactions API to
      categorize fee, wire, and card spend; treasury yield appears as a credit
      entry on the linked treasury account.
  - name: Allocation
    description: >-
      Tag transactions with the note field on payment creation, and assign cards
      to spend owners. Use webhooks to land transaction events into a finops or
      ledger store at near-real-time.
  - name: Optimization
    description: >-
      Choose the lowest tier that satisfies your invoicing-API and reimbursement-user
      needs. Prefer ACH over wire where speed allows. Park idle cash in Mercury
      Treasury to convert float to yield.
  - name: Accountability
    description: >-
      Assign a finance owner per Mercury account. Rotate API tokens via Settings and
      keep the IP allowlist current to prevent unauthorized API spend on outbound
      payments.
maintainers:
