description: >-
  FOCUS-aligned FinOps for Mercury. Cost is dominated by three streams - a flat monthly
  product subscription (Mercury free, Plus $35/mo, Pro $350/mo), per-transaction fees on
  certain invoicing payments (e.g. Plus charges $1 per ACH invoice payment, free on Pro),
  and outbound wire fees for international wires and certain domestic flows. Treasury
  yields offset cost as a credit. The API itself is not separately metered; usage limits
  apply to invoicing-API calls and active-user counts on reimbursements.
sources:
  - https://mercury.com/pricing
  - https://docs.mercury.com/
