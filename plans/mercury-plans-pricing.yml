description: >-
  Mercury sells three product tiers - Mercury (free), Mercury Plus, and Mercury Pro. Tier
  pricing is monthly, with annual billing offering a discount. The API itself is included
  on every tier, but invoicing-API call volume and active-user counts for expense
  reimbursements scale with the tier. Mass-payments-by-API and other higher-volume
  workflows require a paid plan.
sources:
  - https://mercury.com/pricing
  - https://docs.mercury.com/
plans:
  - id: mercury-free
    name: Mercury (Free)
    type: freemium
    description: >-
      Free banking tier. No monthly fee, no minimum balance. Includes core
      checking/savings, basic payments, basic invoicing, and free expense
      reimbursements for up to 5 active users monthly. API access is included for
      reads and basic writes.
    entries:
      - label: Monthly Subscription
        name: subscription
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        unit: 1
        price: '$0'
        userMultiplied: false
      - label: Active Users (Reimbursements)
        name: active_users
        type: quota
        metric: user
        limit: 5
        timeFrame: month
        unit: 1
        price: included
        userMultiplied: false
      - label: API Access
        name: api_access
        type: included
        metric: requests
        limit: -1
        timeFrame: month
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Checking and Savings Accounts
      - name: Free Domestic ACH and Wires (Limits Apply)
      - name: Basic Invoicing
      - name: Read API Access
      - name: 1099 Tax Forms
  - id: mercury-plus
    name: Mercury Plus
    type: subscription
    description: >-
      $35/month ($29.17/month annual). Adds recurring invoices, ACH invoice payments
      ($1 per payment), an invoicing API capped at 500 invoices created per month, up
      to 20 active users for expense reimbursements, and 6 months of free Xero access.
    entries:
      - label: Monthly Subscription
        name: subscription
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        unit: 1
        price: '$35'
        userMultiplied: false
