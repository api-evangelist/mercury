      - label: Active Users (Reimbursements)
        name: active_users
        type: quota
        metric: user
        limit: 20
        timeFrame: month
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Recurring Invoices
      - name: Invoicing API (500/Month)
      - name: ACH Invoice Payments ($1/payment)
      - name: 6 Months Free Xero
      - name: Up to 20 Active Reimbursement Users
